interface:
  display_name: "GitHub Open Source Lifecycle"
  short_description: "Standardize and release open-source projects"
  default_prompt: "Use $github-open-source-lifecycle to right-size this project's public lifecycle work to the requested scope, resolve the public language strategy before material documentation work, use its internal npm/GitHub README split workflow when applicable, keep GitHub Actions as the sole formal publisher for automatable release targets, prefer the protected-branch and release-PR flow for PR-based repositories, require the specific release PR to merge before Actions creates the tag, implement only authorized changes, and verify only the delivery surfaces claimed."
