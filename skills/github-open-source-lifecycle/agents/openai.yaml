interface:
  display_name: "GitHub Open Source Lifecycle"
  short_description: "Standardize and release open-source projects"
  default_prompt: "Use $github-open-source-lifecycle to right-size this project's public lifecycle work to the requested scope, default to separate npm and GitHub README surfaces when both exist, route that implementation through $split-npm-github-readme, implement only authorized changes, and verify only the delivery surfaces claimed."
