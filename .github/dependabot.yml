version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Shanghai
    cooldown:
      default-days: 14
    open-pull-requests-limit: 0
    groups:
      toolchain-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: oxfmt
        update-types:
          - "version-update:semver-minor"
    commit-message:
      prefix: build
      prefix-development: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "09:30"
      timezone: Asia/Shanghai
    cooldown:
      default-days: 14
    open-pull-requests-limit: 0
    groups:
      routine-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "ci(deps)"
